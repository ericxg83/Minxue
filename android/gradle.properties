# Specifies the JVM arguments used for the daemon process.
#
# 曾用 -javaagent 加载 agent/pipefix-agent.jar 修 Windows 上 PipeImpl(UDS) 启动问题。
# 该目录已随 461f06b 归档到仓库外（D:/Minxue_Archive/auto-20260930/tracked_junk/agent/），
# 引用写死在本文件里会让 gradle 直接启动失败：
#   Error opening zip file or JAR manifest missing : .../agent/pipefix-agent.jar
# 实测 Gradle 8.14.3 + JDK 21.0.11 已不再需要该 agent（2026-10-08 去 agent 后 assembleDebug 通过），
# 且本文件在 CI（ubuntu-latest）上同样生效，Windows 绝对路径必然失败，故不再内联。
# 若某天又遇到 PipeImpl 报错，用环境变量临时注入，不要写回本文件：
#   JAVA_TOOL_OPTIONS=-javaagent:C:/Users/Administrator/.workbuddy-ai/binaries/gradle/pipefix-agent.jar
org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true
# org.gradle.jvmargs=-Xmx1536m
# org.gradle.jvmargs=-Xmx2048m

