name: Render Keepalive

# ── 为什么需要这个 workflow ────────────────────────────────────────────
# 后端 minxue-api 挂在 Render 免费实例上（render.yaml: plan: free）。
# Render 免费实例在「15 分钟无入站 HTTP 请求」后会 spin down，
# 而实例唤醒时要重新调度容器、并串行重跑 server/index.js 里 48 个数据库迁移
# （每个迁移 2 次 DB 往返，且 Render 在 Oregon、Neon 在新加坡，单次往返约 200ms）。
# 结果就是用户「过一段时间打开 App」要干等 30~60 秒。
#
# 这里每 10 分钟打一次极轻量的 /api/health（该路由不查库），
# 让实例保持常驻，把冷启动从用户路径上彻底移除。
#
# 为什么是 10 分钟而不是 5 分钟：
#   GitHub 的 schedule 在高负载时可能延迟数分钟，10 分钟间隔 + 延迟
#   仍能稳定落在 Render 的 15 分钟阈值内；同时把 Action 分钟数压到最低。
#   仓库为 public 时 Actions 不计费；private 仓库每月约消耗 1.5k 分钟。
#   若想完全免费且时间更精确，可另建一个 Cloudflare Worker 用 Cron Triggers
#   触发同一个 URL（注意：本仓库的 wrangler.toml 是 Pages 配置，
#   Pages Functions 不支持 cron，需要单独的 Worker）。

on:
  schedule:
    # ⛔ 2026-10-20 实测：本 workflow 名义上每 10 分钟一次（144 次/天），
    #   实际通过 GitHub API 拉到近 90 次运行记录，**每天只跑 3–8 次**且时刻随机
    #   （10-11 至 10-20 每天 2–8 次）；间隔常达 4–6 小时 ≫ Render 15 分钟休眠阈值
    #   ⇒ 保活从来没真正生效过，Render 照样反复睡/醒。根因是 GitHub 对 schedule 的
    #   限流与丢弃（公开仓库也一样），不是 cron 写法问题。
    #   ⇒ 该 workflow 只作为「尽力而为」的兜底；可靠保活靠 workers/keepalive 的
    #     Cloudflare Cron Triggers（5 分钟精确触发）。
    #
    # 只在高峰窗口内保活（负责人 2026-10-20 指示：高峰期间不要断，其余时间让它睡）。
    # 高峰口径与 server/lib/peakWindows.mjs 同一份：周一~周五 15:00–21:30（北京时间）。
    # UTC cron：06:50Z–13:50Z 对应 14:50–21:50 北京时间（06 点这一小时用于 10 分钟预热，
    # 精确门控由下面 run 步骤里的北京时间判定负责）。
    - cron: '*/10 6-13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

# 同一时刻只允许一个保活任务，避免堆积
concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /api/health
        run: |
          # ── 高峰窗口门控（北京时间 UTC+8）──────────────────────────────
          # 口径与 server/lib/peakWindows.mjs 一致：周一~周五 15:00–21:30，
          # 外加 15 分钟预热（14:45 起）。窗口外一个请求都不发 —— 让 Render 正常睡，
          # 睡觉是我们的策略而不是被动事故。
          # 为什么 cron 之外还要兜这一层：GH schedule 会延迟数十分钟甚至跨出窗口才真正
          # 跑起来（实测每天只触发 3–8 次），迟到的那次不该把实例白叫醒。
          BJ=$(date -u -d '+8 hours' +%u-%H%M)
          DOW=${BJ%%-*}; HM=${BJ##*-}
          if [ "$DOW" -gt 5 ] || [ "$HM" -lt 1445 ] || [ "$HM" -gt 2150 ]; then
            echo "窗口外（北京时间 $BJ），本次跳过保活，让实例正常休眠"
            exit 0
          fi

          URL="https://minxue-api.onrender.com/api/health"

          for attempt in 1 2 3; do
            # 实例若在休眠，这一次请求会等容器起来，因此单次超时放宽到 120s
            code=$(curl -s -o health.json -w '%{http_code}' \
              --max-time 120 --noproxy '*' "$URL" || echo "000")

            if [ "$code" = "200" ]; then
              echo "保活成功（第 $attempt 次尝试，HTTP $code）"
              cat health.json
              echo
              exit 0
            fi

            echo "第 $attempt 次尝试未成功：HTTP $code"
            sleep 15
          done

          echo "三次探测均失败，实例可能未启动或服务异常，请检查 Render Dashboard"
          exit 1
