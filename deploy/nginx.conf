# 敏学前端 + API 反代
# 前端用同源 /api 调后端（代码里 API_BASE = VITE_API_URL || '/api'），
# 所以这里把 /api 反代到 app 容器，前端代码一行都不用改。
#
# 首次没证书想先验证：把下面 443 server 整段注释掉，
# 并把 80 server 里的 `return 302 ...` 删掉，另加 `root /usr/share/nginx/html;`
# 和本文件里其余 location 块（直接复用即可）。推荐还是先办证书再 up。

server {
    listen 80;
    server_name your-domain.example.cn;
    # 有证书后强制跳 HTTPS；没证书时见顶部说明
    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.example.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;

    # 安全头（对齐原 wrangler.toml）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # API 反代：/api/* → 后端容器 3001（同源，不触发 CORS）
    location /api/ {
        proxy_pass http://app:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PC 工作台入口
    location = /workbench {
        rewrite ^ /workbench.html break;
    }
    location /workbench/ {
        rewrite ^ /workbench.html break;
    }

    # SPA 兜底：未知路由回 index.html（移动端 React 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
