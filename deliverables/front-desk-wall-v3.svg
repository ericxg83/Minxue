<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1920" viewBox="0 0 1600 1920">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e293b"/><stop offset=".62" stop-color="#273449"/><stop offset="1" stop-color="#172236"/></linearGradient>
  <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#334155"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#1e293b" flood-opacity=".18"/></filter>
  <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".18"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1"/></pattern>
</defs>
<!-- architectural room -->
<rect width="1600" height="1920" fill="url(#wall)"/>
<rect y="1650" width="1600" height="270" fill="#dbe2eb"/>
<path d="M0 1650H1600" stroke="#cbd5e1" stroke-width="4"/>
<path d="M120 0V1650 M1480 0V1650" stroke="#e2e8f0" stroke-width="8"/>
<ellipse cx="800" cy="250" rx="580" ry="150" fill="#dbe4ff" opacity=".6" filter="url(#blur)"/>
<!-- feature wall panel -->
<rect x="110" y="105" width="1380" height="1540" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
<rect x="110" y="105" width="1380" height="1540" rx="28" fill="url(#grid)"/>
<path d="M110 410 C380 205 600 240 800 345 C1060 485 1240 260 1490 190" fill="none" stroke="#6366f1" stroke-opacity=".25" stroke-width="10"/>
<path d="M110 500 C390 295 610 330 810 430 C1060 555 1260 355 1490 285" fill="none" stroke="#8b5cf6" stroke-opacity=".12" stroke-width="3"/>
<!-- logo lockup -->
<g transform="translate(210 220)">
  <rect width="86" height="86" rx="24" fill="url(#indigo)" filter="url(#smallShadow)"/>
  <path d="M24 47 43 28 63 39 48 54 67 66 45 79 24 67 40 54Z" fill="#fff"/>
  <text x="112" y="40" font-family="Arial,Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#fff">敏学</text>
  <text x="114" y="68" font-family="Arial,sans-serif" font-size="14" letter-spacing="4" fill="#c7d2fe">MINXUE LEARNING</text>
</g>
<!-- headline -->
<text x="210" y="555" font-family="Arial,Microsoft YaHei,sans-serif" font-size="82" font-weight="700" fill="#fff">看见问题</text>
<text x="210" y="660" font-family="Arial,Microsoft YaHei,sans-serif" font-size="82" font-weight="700" fill="#fff">解决问题 · 见证成长</text>
<rect x="215" y="716" width="118" height="8" rx="4" fill="url(#indigo)"/>
<text x="210" y="794" font-family="Arial,Microsoft YaHei,sans-serif" font-size="28" fill="#cbd5e1">从完成作业，到真正掌握，我们陪孩子把每一步走扎实。</text>
<!-- cycle line -->
<path d="M260 1040 H1340" stroke="#64748b" stroke-opacity=".45" stroke-width="2"/>
<g font-family="Arial,Microsoft YaHei,sans-serif">
  <g transform="translate(210 930)"><circle cx="55" cy="55" r="55" fill="#eef2ff"/><text x="55" y="69" text-anchor="middle" font-size="32" font-weight="700" fill="#4f46e5">01</text><text x="0" y="165" font-size="27" font-weight="700" fill="#fff">认真检查</text><text x="0" y="207" font-size="20" fill="#cbd5e1">不只看完成，更看错在哪里</text></g>
  <g transform="translate(550 930)"><circle cx="55" cy="55" r="55" fill="#f3e8ff"/><text x="55" y="69" text-anchor="middle" font-size="32" font-weight="700" fill="#7c3aed">02</text><text x="0" y="165" font-size="27" font-weight="700" fill="#fff">找到错因</text><text x="0" y="207" font-size="20" fill="#cbd5e1">分清知识、方法与习惯问题</text></g>
  <g transform="translate(890 930)"><circle cx="55" cy="55" r="55" fill="#e0e7ff"/><text x="55" y="69" text-anchor="middle" font-size="32" font-weight="700" fill="#6366f1">03</text><text x="0" y="165" font-size="27" font-weight="700" fill="#fff">针对辅导</text><text x="0" y="207" font-size="20" fill="#cbd5e1">针对真实原因，再安排训练</text></g>
  <g transform="translate(1230 930)"><circle cx="55" cy="55" r="55" fill="#ede9fe"/><text x="55" y="69" text-anchor="middle" font-size="32" font-weight="700" fill="#8b5cf6">04</text><text x="0" y="165" font-size="27" font-weight="700" fill="#fff">再次检测</text><text x="0" y="207" font-size="20" fill="#cbd5e1">讲过不等于会了，结果需要验证</text></g>
</g>
<!-- closing block -->
<line x1="210" y1="1320" x2="1390" y2="1320" stroke="#475569" stroke-width="2"/>
<text x="210" y="1410" font-family="Arial,Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#fff">陪伴不止于守着，教育贵在看见。</text>
<text x="210" y="1480" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" letter-spacing="5" fill="#a5b4fc">敏学晚托 · 认真看见每个孩子的学习问题</text>
<!-- reception desk -->
<g filter="url(#shadow)"><rect x="250" y="1575" width="1100" height="235" rx="22" fill="url(#desk)"/><rect x="250" y="1575" width="1100" height="12" rx="6" fill="url(#indigo)"/><text x="800" y="1725" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#fff">敏学晚托</text><text x="800" y="1765" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" letter-spacing="4" fill="#a5b4fc">SEE THE PROBLEM · BUILD THE GROWTH</text></g>
<!-- practical light strips -->
<rect x="190" y="140" width="5" height="1380" rx="2" fill="#818cf8" opacity=".75"/><rect x="1405" y="140" width="5" height="1380" rx="2" fill="#a78bfa" opacity=".45"/>
<!-- plant silhouette -->
<g opacity=".85"><path d="M1430 1650 Q1455 1410 1510 1320 M1470 1490 Q1395 1400 1360 1420 M1480 1450 Q1550 1340 1590 1380 M1450 1530 Q1390 1490 1360 1515" stroke="#64748b" stroke-width="16" fill="none"/><path d="M1400 1655H1530L1505 1730H1425Z" fill="#94a3b8"/></g>
<text x="150" y="1875" font-family="Arial,sans-serif" font-size="16" fill="#64748b">FRONT DESK WALL · 2.5m W × 3m H · COLOR SYSTEM: MINXUE WORKBENCH</text>
</svg>
