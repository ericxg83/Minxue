services:
  - type: web
    name: minxue-api
    rootDir: server
    plan: free
    env: node
    nodeVersion: "22"
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: NEON_DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_ENDPOINT
        value: https://api-inference.modelscope.cn/v1/chat/completions
      - key: AI_MODEL
        # 魔搭视觉主模型：用 Qwen3-VL-235B（质量明显优于 8B，且魔搭有独立免费日配额）为主力，
        # 代码 VL_MODELS 里 8B / 8B-Thinking 依次作第一/最深兜底。若已在 Render Dashboard 填过，
        # 请把该值同步改为 Qwen/Qwen3-VL-235B-A22B-Instruct 后重新部署。
        value: Qwen/Qwen3-VL-235B-A22B-Instruct
      - key: MODELSCOPE_BACKUP_API_KEY
        sync: false
      # 备用 API：仅 TackleKey 一个厂商兜底（视觉/文本统一用 gemini-2.5-flash-nothink）
      # 已移除 Agnes / Sensnova / OpenRouter（不产 JSON 或免费额度不可用）。
      # 标 sync:false 留空，由代码按 Key 前缀自动路由 endpoint / 模型，勿硬编码。
      - key: TACKLEKEY_API_KEY
        sync: false
      - key: BACKUP_ENDPOINT
        sync: false
      - key: BACKUP_MODEL
        sync: false
      - key: BACKUP_VL_MODEL
        sync: false
      # 2026-08 实验：第二备用供应商 ZenMux（多模型聚合网关，OpenAI 兼容）。
      # pay-as-you-go：deepseek 文本免费、mino 视觉免费。
      # 需用户从 Render Dashboard 手动填入 Key（默认空，BACKUP_VENDOR_DEFS 自动按 keyPrefix 过滤）。
      # 在 WorksheetManagement 顶部"AI 供应商预览"按钮里在线测试效果。
      # 注意：zenmux.ai 在中国大陆被墙，Render（Oregon）出站正常。
      - key: ZENMUX_API_KEY
        sync: false
      # 2026-08 实验：智谱 BigModel（OpenAI 兼容，国内直连无 GFW 问题）。
      # 免费模型即零余额可用（文本 glm-4-flash/glm-4.5-flash、视觉 glm-4v-flash）；
      # 新品 GLM-5V-Turbo（glm-5v-turbo）需余额>0，充值后自动生效。Key 形如 <id>.<secret>。
      - key: BIGMODEL_API_KEY
        sync: false
      # 第一备用供应商：商汤 SenseNova（OpenAI 兼容，国内直连，token.sensenova.cn）。
      # 2026-08 实测：sensenova-6.8-flash-lite / sensenova-6.7-flash-lite 为多模态视觉、0 计费；
      # deepseek-v4-flash / glm-5.2 为纯文本、0 计费。Key 无前缀要求，直接填 sk-... 即可。
      - key: SENSENOVA_API_KEY
        sync: false
      # 最最后兜底（付费）：AgentRouter 中转网关，OpenAI 兼容，模型 gpt-5.6-sol。
      # endpoint=https://agentrouter.org/v1，仅当前面魔搭+全部免费备用都失败时才触发。
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: OSS_REGION
        value: oss-cn-shanghai
      - key: OSS_BUCKET
        sync: false
      - key: OSS_ACCESS_KEY_ID
        sync: false
      - key: OSS_ACCESS_KEY_SECRET
        sync: false
      - key: OSS_CDN_DOMAIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MAX_RETRIES
        value: 3
      - key: TASK_TIMEOUT_MS
        value: 1800000
      - key: CONCURRENCY
        value: 2
      - key: ALLOWED_ORIGIN
        sync: false
